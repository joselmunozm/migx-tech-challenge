[project]
name = "medical-document-assistant"
version = "0.1.0"
description = "Local assistant for questions over medical documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "chromadb>=0.5.20",
    "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=48.0.1,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cohere>=5.13",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openrouter>=0.1",
    "langfuse>=3.0",
    "streamlit>=1.40",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "polars>=2.1.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
